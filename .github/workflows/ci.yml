name: CI

on:
  # No branch filter: `branches` matches a pull request's base, so restricting
  # it to main skipped CI entirely on stacked pull requests, which target the
  # branch below them rather than main.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Pinned so CI matches the release job rather than drifting with
      # whatever Node the runner image happens to bundle.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # The size report shells out to `npm pack --json`, whose output shape
      # changed in npm 12. Runner images still bundle npm 10, so pin npm 12
      # to exercise the shape published releases actually run against, and
      # print the version so the log records which shape was tested.
      - name: Setup npm 12
        run: |
          npm install -g npm@12
          npm --version

      - name: Install dependencies
        run: bun install

      # Must run after the build: benchmarks/joyful.bench.ts imports from
      # dist, so typecheck fails on a clean checkout without it.
      - name: Build
        run: bun run build

      - name: Lint and typecheck
        run: bun run check

      - name: Run tests
        run: bun test

      # The word lists are the package's core data, but nothing else in CI
      # reads them: a pull request adding a duplicate, plural, or hyphenated
      # word passes the build, lint, typecheck, and tests untouched. The
      # `:check` variant reports without rewriting, so a bad entry fails the
      # job instead of being silently repaired in the runner.
      - name: Validate word lists
        run: bun run validate:check

      - name: Run performance reports
        run: bun run perf
